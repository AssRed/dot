[project]
name = "beauty-master-bot"
version = "0.1.0"
description = "Telegram bot for a single beauty master (aiogram 3)"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.4,<4",
    "asyncpg>=0.29,<1",
    "APScheduler>=3.10,<4",
    "openpyxl>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
    "fastapi>=0.110,<1",
    "fastapi-cli[standard]>=0.0.5",
    "uvicorn[standard]>=0.27,<1",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "database", "keyboards", "main", "app"]

[tool.setuptools.packages.find]
include = ["handlers*", "utils*"]
