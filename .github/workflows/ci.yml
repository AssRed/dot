name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes pytest
      - name: Pyflakes
        run: |
          python -m pyflakes config.py database.py keyboards.py main.py \
            handlers/*.py utils/*.py scripts/*.py tests/*.py
      - name: Smoke test
        run: |
          python scripts/smoke.py
      - name: Unit tests
        run: |
          pytest -q
